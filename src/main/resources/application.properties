spring.application.name=messenger

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:25432/mydatabase}
spring.datasource.username=${DB_USERNAME:myuser}
spring.datasource.password=${DB_PASSWORD:secret}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:26379}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:29092,localhost:29094,localhost:29096}

kafka.topic.chat-messages=${KAFKA_TOPIC_CHAT_MESSAGES:chat-messages}
kafka.topic.chat-read=${KAFKA_TOPIC_CHAT_READ:chat-read}
kafka.topic.partitions=${KAFKA_TOPIC_PARTITIONS:3}
kafka.topic.replication-factor=${KAFKA_TOPIC_REPLICATION_FACTOR:3}

# WARNING: override JWT_SECRET and DB_PASSWORD with strong values in all non-development environments
jwt.secret=${JWT_SECRET:dev-only-insecure-secret-override-in-production}
jwt.expiration-ms=${JWT_EXPIRATION_MS:7200000}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
